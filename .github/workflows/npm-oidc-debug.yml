name: npm OIDC debug

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  debug:
    name: Inspect OIDC claims and auth
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Show npm version
        run: npm --version

      - name: Mint OIDC token and show claims
        run: |
          curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npmjs.org" -o /tmp/oidc.json
          node -e "
            const token = require('/tmp/oidc.json').value
            const payload = token.split('.')[1]
            const claims = JSON.parse(Buffer.from(payload.replace(/-/g, '+').replace(/_/g, '/'), 'base64').toString())
            console.log(JSON.stringify({
              repository: claims.repository,
              workflow: claims.workflow,
              job_workflow_ref: claims.job_workflow_ref,
              ref: claims.ref,
              environment: claims.environment ?? null,
              actor: claims.actor,
              audience: claims.aud,
            }, null, 2))
          "

      - name: Auth-only publish probe (version already exists on npm)
        run: |
          set +e
          OUTPUT="$(npm publish --provenance --access public --tag dev --loglevel verbose 2>&1)"
          STATUS=$?
          echo "$OUTPUT" | grep -vE '^npm (verb|sill)' | tail -25
          echo "---"
          echo "$OUTPUT" | grep -iE 'oidc|provenance|ENEEDAUTH|E403|E409|EPUBLISHCONFLICT|token' | tail -15
          echo "exit status: $STATUS (E409/EPUBLISHCONFLICT = auth OK, ENEEDAUTH/E403 = trusted publisher mismatch)"
